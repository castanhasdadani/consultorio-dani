<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsiGestão - Sistema Integrado de Prontuário Psicológico</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Dexie.js (Wrapper IndexedDB / Banco de Dados Local Completo) -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
  <!-- jsPDF & AutoTable para Geração de PDFs Semanais -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              300: '#fda4af',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
            }
          }
        }
      }
    }
  </script>
  <style>
    .bg-gradient-rose {
      background: linear-gradient(135deg, #be123c 0%, #e11d48 50%, #fb7185 100%);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #fff1f2;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #fda4af;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-rose-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-200">

  <!-- NAVBAR SUPERIOR -->
  <header class="bg-gradient-rose text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('dashboard')">
        <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
          <i data-lucide="heart-pulse" class="w-6 h-6 text-white"></i>
        </div>
        <span class="font-bold text-xl tracking-tight text-white">PsiGestão</span>
      </div>
      
      <nav class="hidden md:flex space-x-1">
        <button onclick="navigateTo('dashboard')" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-white/10 transition flex items-center gap-2">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </button>
        <button onclick="navigateTo('pacientes')" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-white/10 transition flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4"></i> Pacientes
        </button>
        <button onclick="navigateTo('sessoes')" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-white/10 transition flex items-center gap-2">
          <i data-lucide="calendar" class="w-4 h-4"></i> Sessões
        </button>
        <button onclick="navigateTo('financeiro')" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-white/10 transition flex items-center gap-2">
          <i data-lucide="dollar-sign" class="w-4 h-4"></i> Financeiro
        </button>
      </nav>

      <!-- Botão Menu Mobile -->
      <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-md hover:bg-white/10">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Dropdown Mobile -->
    <div id="mobileMenu" class="hidden md:hidden bg-rose-800 border-t border-rose-700 px-4 pt-2 pb-3 space-y-1">
      <button onclick="navigateTo('dashboard'); toggleMobileMenu()" class="w-full text-left px-3 py-2 rounded-md text-base font-medium text-white hover:bg-rose-700 flex items-center gap-2">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
      </button>
      <button onclick="navigateTo('pacientes'); toggleMobileMenu()" class="w-full text-left px-3 py-2 rounded-md text-base font-medium text-white hover:bg-rose-700 flex items-center gap-2">
        <i data-lucide="users" class="w-5 h-5"></i> Pacientes
      </button>
      <button onclick="navigateTo('sessoes'); toggleMobileMenu()" class="w-full text-left px-3 py-2 rounded-md text-base font-medium text-white hover:bg-rose-700 flex items-center gap-2">
        <i data-lucide="calendar" class="w-5 h-5"></i> Sessões
      </button>
      <button onclick="navigateTo('financeiro'); toggleMobileMenu()" class="w-full text-left px-3 py-2 rounded-md text-base font-medium text-white hover:bg-rose-700 flex items-center gap-2">
        <i data-lucide="dollar-sign" class="w-5 h-5"></i> Financeiro
      </button>
    </div>
  </header>

  <!-- BARRA SUB-HEADER COM BOTÃO VOLTAR GLOBAL -->
  <div class="bg-rose-100 border-b border-rose-200 px-4 sm:px-8 py-2 flex items-center justify-between">
    <div id="backButtonContainer">
      <button onclick="goBack()" class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-rose-700 bg-white border border-rose-300 rounded-lg shadow-sm hover:bg-rose-50 transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar
      </button>
    </div>
    <div id="breadcrumbText" class="text-xs font-semibold text-rose-800 uppercase tracking-wider">
      PsiGestão / Dashboard
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL (RENDERIZADO DINAMICAMENTE) -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <!-- View ativa será injetada via JavaScript -->
  </main>

  <!-- MODAIS DO SISTEMA -->
  <div id="modalContainer"></div>

  <!-- RODAPÉ -->
  <footer class="bg-white border-t border-rose-100 py-4 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-rose-500 font-medium">
      PsiGestão © 2026 — Sistema Privado de Gestão de Prontuários Psicológicos. Dados Persistidos com Segurança Local.
    </div>
  </footer>

  <!-- LÓGICA DO SISTEMA -->
  <script>
    // ==========================================
    // 1. BANCO DE DADOS LOCAL (Dexie.js / IndexedDB)
    // ==========================================
    const db = new Dexie('PsiGestaoDB');
    db.version(1).stores({
      pacientes: '++id, nome, status, tipoAtendimento, dataCadastro',
      sessoes: '++id, pacienteId, data, status, valor, statusPagamento, dataPagamento',
      evolucoes: '++id, pacienteId, sessaoId, data',
      recibos: '++id, pacienteId, sessaoId, dataCriacao',
      pdfsSemanais: '++id, pacienteId, dataCriacao, semana'
    });

    // ==========================================
    // 2. ESTADO GLOBAL DA APLICAÇÃO & NAVEGAÇÃO
    // ==========================================
    const state = {
      currentView: 'dashboard',
      viewParam: null,
      historyStack: []
    };

    function navigateTo(view, param = null, addToHistory = true) {
      if (addToHistory && state.currentView) {
        state.historyStack.push({ view: state.currentView, param: state.viewParam });
      }
      state.currentView = view;
      state.viewParam = param;
      render();
    }

    function goBack() {
      if (state.historyStack.length > 0) {
        const previous = state.historyStack.pop();
        state.currentView = previous.view;
        state.viewParam = previous.param;
        render();
      } else {
        state.currentView = 'dashboard';
        state.viewParam = null;
        render();
      }
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }

    // ==========================================
    // 3. MOTORES DE CÁLCULO E ALERTAS DE PENDÊNCIAS
    // ==========================================
    async function getAlerts() {
      const pacientes = await db.pacientes.toArray();
      const sessoes = await db.sessoes.toArray();
      const evolucoes = await db.evolucoes.toArray();
      const recibos = await db.recibos.toArray();
      const pdfs = await db.pdfsSemanais.toArray();

      const alerts = [];

      // 1. Sessões Realizadas Sem Evolução
      for (const s of sessoes) {
        if (s.status === 'Realizada') {
          const temEvolucao = evolucoes.some(e => e.sessaoId === s.id);
          if (!temEvolucao) {
            const pac = pacientes.find(p => p.id === s.pacienteId);
            alerts.push({
              tipo: 'evolucao',
              pacienteId: s.pacienteId,
              sessaoId: s.id,
              texto: `Evolução pendente: ${pac ? pac.nome : 'Paciente'} (Sessão de ${formatDate(s.data)})`,
              link: () => navigateTo('prontuario', s.pacienteId)
            });
          }
        }
      }

      // 2. Pagamento Recebido Sem Recibo
      for (const s of sessoes) {
        if (s.statusPagamento === 'Pago') {
          const temRecibo = recibos.some(r => r.sessaoId === s.id);
          if (!temRecibo) {
            const pac = pacientes.find(p => p.id === s.pacienteId);
            alerts.push({
              tipo: 'recibo',
              pacienteId: s.pacienteId,
              sessaoId: s.id,
              texto: `Recibo não anexado: ${pac ? pac.nome : 'Paciente'} (Sessão de ${formatDate(s.data)})`,
              link: () => navigateTo('prontuario', s.pacienteId)
            });
          }
        }
      }

      // 3. Verificação de PDF Semanal Pendente
      const seteDiasAtras = new Date();
      seteDiasAtras.setDate(seteDiasAtras.getDate() - 7);

      for (const p of pacientes.filter(pac => pac.status === 'Ativo')) {
        const sessoesRecentes = sessoes.filter(s => s.pacienteId === p.id && s.status === 'Realizada' && new Date(s.data) >= seteDiasAtras);
        if (sessoesRecentes.length > 0) {
          const pdfRecente = pdfs.some(pdf => pdf.pacienteId === p.id && new Date(pdf.dataCriacao) >= seteDiasAtras);
          if (!pdfRecente) {
            alerts.push({
              tipo: 'pdf',
              pacienteId: p.id,
              texto: `Prontuário semanal pendente: ${p.nome}`,
              link: () => navigateTo('prontuario', p.id)
            });
          }
        }
      }

      // 4. Dados Obrigatórios Faltando no Cadastro
      for (const p of pacientes) {
        if (!p.nome || !p.tipoAtendimento || (p.tipoAtendimento === 'Infantil' && !p.nomeResponsavel)) {
          alerts.push({
            tipo: 'cadastro',
            pacienteId: p.id,
            texto: `Informação obrigatória faltando no cadastro de ${p.nome || 'Paciente sem nome'}`,
            link: () => openModalPaciente(p.id)
          });
        }
      }

      return alerts;
    }

    // ==========================================
    // 4. RENDERING PRINCIPAL
    // ==========================================
    async function render() {
      const app = document.getElementById('app');
      document.getElementById('breadcrumbText').innerText = `PsiGestão / ${state.currentView.toUpperCase()}`;
      
      // Controle do botão voltar
      const backBtn = document.getElementById('backButtonContainer');
      backBtn.style.display = state.historyStack.length > 0 ? 'block' : 'inline-block';

      if (state.currentView === 'dashboard') {
        app.innerHTML = await renderDashboard();
      } else if (state.currentView === 'pacientes') {
        app.innerHTML = await renderPacientes();
      } else if (state.currentView === 'prontuario') {
        app.innerHTML = await renderProntuario(state.viewParam);
      } else if (state.currentView === 'sessoes') {
        app.innerHTML = await renderSessoes();
      } else if (state.currentView === 'financeiro') {
        app.innerHTML = await renderFinanceiro();
      }

      lucide.createIcons();
    }

    // ==========================================
    // 5. VIEW: DASHBOARD
    // ==========================================
    async function renderDashboard() {
      const pacientes = await db.pacientes.toArray();
      const sessoes = await db.sessoes.toArray();
      const alerts = await getAlerts();

      const totalPacientes = pacientes.length;
      const ativos = pacientes.filter(p => p.status === 'Ativo').length;
      const inativos = pacientes.filter(p => p.status === 'Inativo').length;

      const agendadas = sessoes.filter(s => s.status === 'Agendada').length;
      const realizadas = sessoes.filter(s => s.status === 'Realizada').length;
      const faltas = sessoes.filter(s => s.status === 'Falta').length;
      const canceladas = sessoes.filter(s => s.status === 'Cancelada').length;

      // Cálculo estritamente baseado nos pagamentos RECEBIDOS
      const hoje = new Date();
      const mesAtual = hoje.getMonth();
      const anoAtual = hoje.getFullYear();

      let valorRecebidoMes = 0;
      let valorPendenteTotal = 0;

      sessoes.forEach(s => {
        if (s.statusPagamento === 'Pago' && s.dataPagamento) {
          const dt = new Date(s.dataPagamento);
          if (dt.getMonth() === mesAtual && dt.getFullYear() === anoAtual) {
            valorRecebidoMes += Number(s.valor || 0);
          }
        } else if (s.statusPagamento === 'Pendente') {
          valorPendenteTotal += Number(s.valor || 0);
        }
      });

      return `
        <!-- Cabeçalho Rápido -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-rose-100">
          <div>
            <h1 class="text-2xl font-bold text-rose-900">Painel Geral de Controle</h1>
            <p class="text-sm text-rose-600">Resumo operacional, financeiro e alertas em tempo real.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button onclick="openModalPaciente()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm transition flex items-center gap-2">
              <i data-lucide="user-plus" class="w-4 h-4"></i> Novo Paciente
            </button>
            <button onclick="openModalSessao()" class="bg-rose-100 hover:bg-rose-200 text-rose-800 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
              <i data-lucide="calendar-plus" class="w-4 h-4"></i> Agendar Sessão
            </button>
          </div>
        </div>

        <!-- AREA DE ALERTAS VERMELHOS E PENDÊNCIAS -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-rose-100">
          <div class="flex items-center gap-2 mb-4">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-red-600"></span>
            </span>
            <h2 class="text-lg font-bold text-slate-800">Alertas e Pendências Importantes</h2>
            <span class="ml-auto bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1 rounded-full">${alerts.length}</span>
          </div>

          ${alerts.length === 0 ? `
            <div class="p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-sm flex items-center gap-2">
              <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i>
              Nenhuma pendência detectada! Todos os prontuários e recibos estão em dia.
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              ${alerts.map(a => `
                <div onclick="executeAlertAction('${a.tipo}', ${a.pacienteId})" class="p-3.5 bg-red-50 hover:bg-red-100 border border-red-200 rounded-xl cursor-pointer transition flex items-start gap-3 group">
                  <span class="text-red-600 font-bold text-lg mt-0.5">🔴</span>
                  <div class="flex-1 text-xs">
                    <p class="font-bold text-red-900 group-hover:underline">${a.texto}</p>
                    <p class="text-red-600 mt-1">Clique para resolver imediatamente →</p>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- CARDS DE ESTATÍSTICAS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Card Pacientes -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold text-rose-500 uppercase tracking-wider">Pacientes</p>
              <h3 class="text-2xl font-black text-rose-950 mt-1">${totalPacientes}</h3>
              <p class="text-xs text-slate-500 mt-1"><span class="text-emerald-600 font-bold">${ativos} ativos</span> • <span class="text-slate-400 font-bold">${inativos} inativos</span></p>
            </div>
            <div class="p-3 bg-rose-50 rounded-xl text-rose-600">
              <i data-lucide="users" class="w-6 h-6"></i>
            </div>
          </div>

          <!-- Card Sessões -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold text-rose-500 uppercase tracking-wider">Sessões Realizadas</p>
              <h3 class="text-2xl font-black text-rose-950 mt-1">${realizadas}</h3>
              <p class="text-xs text-slate-500 mt-1">${agendadas} agendadas • ${faltas} faltas</p>
            </div>
            <div class="p-3 bg-rose-50 rounded-xl text-rose-600">
              <i data-lucide="check-circle" class="w-6 h-6"></i>
            </div>
          </div>

          <!-- Card Financeiro Recebido -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Recebido no Mês</p>
              <h3 class="text-2xl font-black text-emerald-700 mt-1">R$ ${valorRecebidoMes.toFixed(2)}</h3>
              <p class="text-xs text-slate-500 mt-1">Pagamentos liquidados em ${getMesAnoAtual()}</p>
            </div>
            <div class="p-3 bg-emerald-50 rounded-xl text-emerald-600">
              <i data-lucide="dollar-sign" class="w-6 h-6"></i>
            </div>
          </div>

          <!-- Card Financeiro Pendente -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 flex items-center justify-between">
            <div>
              <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Valores Pendentes</p>
              <h3 class="text-2xl font-black text-amber-700 mt-1">R$ ${valorPendenteTotal.toFixed(2)}</h3>
              <p class="text-xs text-slate-500 mt-1">Total a receber de pacientes</p>
            </div>
            <div class="p-3 bg-amber-50 rounded-xl text-amber-600">
              <i data-lucide="clock" class="w-6 h-6"></i>
            </div>
          </div>
        </div>

        <!-- ACESSO RÁPIDO AOS PACIENTES -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-rose-100 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-rose-950">Pacientes Recentes</h2>
            <button onclick="navigateTo('pacientes')" class="text-xs font-semibold text-rose-600 hover:text-rose-800">Ver Todos →</button>
          </div>
          <div class="divide-y divide-rose-50">
            ${pacientes.slice(0, 5).map(p => `
              <div class="py-3 flex items-center justify-between">
                <div>
                  <p class="font-bold text-sm text-slate-800">${p.nome}</p>
                  <p class="text-xs text-slate-500">${p.tipoAtendimento} • Telefone: ${p.telefone || 'Não informado'}</p>
                </div>
                <button onclick="navigateTo('prontuario', ${p.id})" class="px-3 py-1.5 bg-rose-50 text-rose-700 text-xs font-semibold rounded-lg hover:bg-rose-100 transition">
                  Abrir Prontuário
                </button>
              </div>
            `).join('')}
            ${pacientes.length === 0 ? '<p class="text-xs text-slate-400 py-2">Nenhum paciente cadastrado ainda.</p>' : ''}
          </div>
        </div>
      `;
    }

    function executeAlertAction(tipo, pacienteId) {
      navigateTo('prontuario', pacienteId);
    }

    // ==========================================
    // 6. VIEW: PACIENTES & FILTROS
    // ==========================================
    let filtroStatusPaciente = 'Ativo';

    async function renderPacientes() {
      const todosPacientes = await db.pacientes.toArray();
      const pacientesFiltrados = todosPacientes.filter(p => p.status === filtroStatusPaciente);

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-rose-100">
          <div>
            <h1 class="text-2xl font-bold text-rose-950">Gestão de Pacientes</h1>
            <p class="text-sm text-rose-600">Listagem, cadastro e controle de status dos prontuários.</p>
          </div>
          <button onclick="openModalPaciente()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm transition flex items-center gap-2">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Cadastrar Paciente
          </button>
        </div>

        <!-- FILTROS -->
        <div class="flex border-b border-rose-200 space-x-4">
          <button onclick="setFiltroPaciente('Ativo')" class="pb-3 text-sm font-bold border-b-2 transition ${filtroStatusPaciente === 'Ativo' ? 'border-rose-600 text-rose-700' : 'border-transparent text-slate-400 hover:text-slate-600'}">
            Pacientes Ativos (${todosPacientes.filter(p => p.status === 'Ativo').length})
          </button>
          <button onclick="setFiltroPaciente('Inativo')" class="pb-3 text-sm font-bold border-b-2 transition ${filtroStatusPaciente === 'Inativo' ? 'border-rose-600 text-rose-700' : 'border-transparent text-slate-400 hover:text-slate-600'}">
            Pacientes Inativos (${todosPacientes.filter(p => p.status === 'Inativo').length})
          </button>
        </div>

        <!-- LISTAGEM -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${pacientesFiltrados.map(p => `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 flex flex-col justify-between hover:border-rose-300 transition">
              <div>
                <div class="flex items-start justify-between">
                  <span class="px-2.5 py-1 text-xs font-bold rounded-full ${p.tipoAtendimento === 'Infantil' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}">
                    Atendimento ${p.tipoAtendimento}
                  </span>
                  <span class="text-xs font-medium px-2 py-0.5 rounded ${p.status === 'Ativo' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                    ${p.status}
                  </span>
                </div>
                <h3 class="text-lg font-bold text-slate-900 mt-3">${p.nome}</h3>
                <p class="text-xs text-slate-500 mt-1">Tel: ${p.telefone || 'Não preenchido'}</p>
                <p class="text-xs text-slate-500">E-mail: ${p.email || 'Não preenchido'}</p>

                ${p.tipoAtendimento === 'Infantil' ? `
                  <div class="mt-3 p-2 bg-amber-50 rounded-lg text-xs text-amber-900 border border-amber-200">
                    <p class="font-bold">Responsável: ${p.nomeResponsavel || 'Não informado'}</p>
                    <p>Parentesco: ${p.parentesco || 'N/A'}</p>

              📊 GERAR RESUMO MENSAL

          <div id="painelResumoMensalProntuario"></div>

          <!-- LISTA DE SESSÕES DO MÊS -->

            ${sessoesFiltradasMes.map(s => {
              const evolucao = evolucoes.find(e => e.sessaoId === s.id);

              return `
                <div class="border border-rose-100 rounded-2xl p-4 bg-white shadow-xs space-y-3">
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-rose-50 pb-2">

                      <span class="font-black text-sm text-rose-950">${formatDate(s.data)} - ${s.horario || '00:00'}</span>

                  <!-- ALERTAS DA SESSÃO -->
                  <div class="flex flex-wrap gap-2 text-xs">

                      <span class="font-bold text-rose-900">Evolução Clínica</span>

    // ==========================================
    // 8. GERADOR AUTOMÁTICO DE RESUMO DO PRONTUÁRIO
    // ==========================================
    async function gerarResumoAutomaticoProntuario(pacienteId) {
      const paciente = await db.pacientes.get(pacienteId);
      const sessoes = await db.sessoes.where('pacienteId').equals(pacienteId).toArray();
      const evolucoes = await db.evolucoes.where('pacienteId').equals(pacienteId).toArray();

      const totalSessoes = sessoes.length;
      const realizadas = sessoes.filter(s => s.status === 'Realizada').length;
      const faltas = sessoes.filter(s => s.status === 'Falta').length;
      const canceladas = sessoes.filter(s => s.status === 'Cancelada').length;

      // Compilado das evoluções reais
      const demandas = evolucoes.map(e => e.demanda).filter(Boolean).join(', ') || 'Não registradas especificamente';
      const queixas = evolucoes.map(e => e.queixa).filter(Boolean).join('; ') || 'Sem resumo de queixas';

      const divResumo = document.getElementById('painelResumoAutomatico');
      divResumo.innerHTML = `
        <div class="bg-rose-900 text-white p-6 rounded-2xl shadow-lg space-y-4 my-4 animate-fade-in">
          <div class="flex items-center justify-between border-b border-rose-800 pb-3">
            <h3 class="font-bold text-lg flex items-center gap-2">
              <i data-lucide="sparkles" class="w-5 h-5 text-rose-300"></i> Resumo Sintético do Prontuário
            </h3>
            <button onclick="copiarResumoProntuario()" class="bg-white/10 hover:bg-white/20 text-xs px-3 py-1.5 rounded-lg font-bold transition">
              Copiar Texto
            </button>
          </div>
          <div id="textoResumoProntuario" class="text-xs space-y-2 leading-relaxed text-rose-100">
            <p><strong>Paciente:</strong> ${paciente.nome} (${paciente.tipoAtendimento})</p>
            <p><strong>Total de Atendimentos:</strong> ${totalSessoes} sessões registradas (${realizadas} realizadas, ${faltas} faltas, ${canceladas} canceladas).</p>
            <p><strong>Demandas Mapeadas:</strong> ${demandas}</p>
            <p><strong>Síntese das Evoluções Clínicas:</strong> ${queixas}</p>
            <p><strong>Situação Atual:</strong> Acompanhamento ${paciente.status === 'Ativo' ? 'em andamento' : 'inativado/encerrado'}.</p>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function copiarResumoProntuario() {
      const el = document.getElementById('textoResumoProntuario');
      navigator.clipboard.writeText(el.innerText);
      alert('Resumo copiado para a área de transferência!');
    }

    async function gerarResumoMensalProntuario(pacienteId) {
      const sessoes = await db.sessoes.where('pacienteId').equals(pacienteId).toArray();
      const sessoesFiltradas = sessoes.filter(s => {
        const d = new Date(s.data);
        return d.getMonth() === Number(mesFiltroHistorico) && d.getFullYear() === Number(anoFiltroHistorico);
      });

      const total = sessoesFiltradas.length;
      const realizadas = sessoesFiltradas.filter(s => s.status === 'Realizada').length;
      const faltas = sessoesFiltradas.filter(s => s.status === 'Falta').length;

      let recebido = 0;
      let pendente = 0;
      sessoesFiltradas.forEach(s => {
        if (s.statusPagamento === 'Pago') recebido += Number(s.valor || 0);
        else pendente += Number(s.valor || 0);
      });

      const container = document.getElementById('painelResumoMensalProntuario');
      container.innerHTML = `
        <div class="bg-rose-100/70 p-4 rounded-xl border border-rose-200 text-xs text-rose-950 grid grid-cols-2 sm:grid-cols-4 gap-3 my-2">
          <div><span class="block text-slate-500 font-semibold">SESSÕES MÊS</span> <strong class="text-sm">${total} (${realizadas} rel.)</strong></div>
          <div><span class="block text-slate-500 font-semibold">FALTAS</span> <strong class="text-sm text-amber-800">${faltas}</strong></div>
          <div><span class="block text-slate-500 font-semibold">RECEBIDO</span> <strong class="text-sm text-emerald-800">R$ ${recebido.toFixed(2)}</strong></div>
          <div><span class="block text-slate-500 font-semibold">PENDENTE</span> <strong class="text-sm text-red-800">R$ ${pendente.toFixed(2)}</strong></div>
        </div>
      `;
    }

    let mesFiltroFinanceiro = new Date().getMonth();
    let anoFiltroFinanceiro = new Date().getFullYear();

    async function renderFinanceiro() {
      const sessoes = await db.sessoes.toArray();
      const pacientes = await db.pacientes.toArray();

      let totalRecebidoMes = 0;
      let qtdPagosMes = 0;
      let totalPendenteGeral = 0;
      let qtdPendentesGeral = 0;

      // Regra Financeira Estrita: Recebido calcula pela DATA DO PAGAMENTO

        }

    // ==========================================
    // 11. MOTOR PDF AUTOMÁTICO (jsPDF)
    // ==========================================
    async function gerarPdfSemanalAutomatico(pacienteId) {
      const paciente = await db.pacientes.get(pacienteId);
      const sessoes = await db.sessoes.where('pacienteId').equals(pacienteId).toArray();
      const evolucoes = await db.evolucoes.where('pacienteId').equals(pacienteId).toArray();

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Configuração visual do PDF (Tons de Rosa/Vinho)
      doc.setFillColor(190, 18, 60); // Rose 700
      doc.rect(0, 0, 210, 25, 'F');

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.setFont("helvetica", "bold");
      doc.text("PRONTUÁRIO PSICOLÓGICO SEMANAL", 14, 16);

      doc.setTextColor(50, 50, 50);
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text(`Paciente: ${paciente.nome}`, 14, 35);
      doc.setFont("helvetica", "normal");
      doc.text(`Tipo de Atendimento: ${paciente.tipoAtendimento}`, 14, 42);
      doc.text(`Data do Relatório: ${formatDate(new Date())}`, 14, 49);

      // Tabela de Sessões e Evoluções do Prontuário
      const rows = sessoes.map(s => {
        const evo = evolucoes.find(e => e.sessaoId === s.id);
        return [
          formatDate(s.data),
          s.status,
          evo ? evo.queixa || 'Evolução registrada' : 'Sem evolução'
        ];
      });

      doc.autoTable({
        startY: 55,
        head: [['Data Sessão', 'Status', 'Resumo Clínico / Evolução']],
        body: rows,
        headStyles: { fillColor: [190, 18, 60] },
        theme: 'striped'
      });

      // Converte para Base64 para anexar no banco
      const pdfBase64 = doc.output('datauristring');
      const semanaStr = `Semana ${getSemanaDoAno()}`;

      await db.pdfsSemanais.add({
        pacienteId: paciente.id,
        semana: semanaStr,
        dataCriacao: new Date().toISOString(),
        nomeArquivo: `Prontuario_${paciente.nome.replace(/\s+/g, '_')}_${semanaStr}.pdf`,
        periodo: `Semana de ${formatDate(new Date())}`,
        conteudoBase64: pdfBase64
      });

      alert('PDF Semanal gerado com sucesso e anexado ao histórico do paciente!');
      render();
    }

    async function processarAnexoRecibo(sessaoId) {
      const fileInput = document.getElementById('fileRecibo');
      if (!fileInput.files[0]) return alert('Selecione um arquivo.');

      const sessao = await db.sessoes.get(sessaoId);
      const reader = new FileReader();
      reader.onload = async function(e) {
        await db.recibos.add({
          pacienteId: sessao.pacienteId,
          sessaoId: sessaoId,
          dataCriacao: new Date().toISOString(),
          conteudoBase64: e.target.result
        });
        closeModal();
        render();
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    }

    // MODAL DE ANEXAR PDF SEMANAL MANUAL
    function openModalAnexarPdfSemanal(pacienteId) {
      const modalHtml = `
        <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-rose-100 space-y-4">
            <h3 class="font-bold text-lg text-rose-950">Adicionar PDF do Prontuário Semanal</h3>
            <input type="file" id="filePdfSemanal" accept="application/pdf" class="w-full text-xs p-2 border rounded-xl">
            <div class="flex justify-end gap-2">
              <button onclick="closeModal()" class="px-3 py-1.5 bg-slate-100 text-xs font-bold rounded-lg">Cancelar</button>
              <button onclick="processarAnexoPdfSemanal(${pacienteId})" class="px-3 py-1.5 bg-rose-600 text-white text-xs font-bold rounded-lg">Salvar PDF</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modalContainer').innerHTML = modalHtml;
    }

    async function processarAnexoPdfSemanal(pacienteId) {
      const fileInput = document.getElementById('filePdfSemanal');
      if (!fileInput.files[0]) return alert('Selecione um arquivo PDF.');

      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = async function(e) {
        const semanaStr = `Semana ${getSemanaDoAno()}`;
        await db.pdfsSemanais.add({
          pacienteId: pacienteId,
          semana: semanaStr,
          dataCriacao: new Date().toISOString(),
          nomeArquivo: file.name,
          periodo: `Semana de ${formatDate(new Date())}`,
          conteudoBase64: e.target.result
        });
        closeModal();
        render();
      };
      reader.readAsDataURL(file);
    }

    async function removerPdfSemanal(id) {
      if (confirm('Remover este PDF semanal do prontuário?')) {
        await db.pdfsSemanais.delete(id);
        render();
      }
    }

    function visualizarPdf(base64) {
      const win = window.open();
      win.document.write(`<iframe src="${base64}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
    }

    function baixarPdf(base64, nome) {
      const a = document.createElement('a');
      a.href = base64;
      a.download = nome;
      a.click();
    }

    function closeModal() {
      document.getElementById('modalContainer').innerHTML = '';
    }

    // ==========================================
    // 13. FUNÇÕES AUXILIARES / FORMATADORES
    // ==========================================
    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      const d = new Date(dateStr);
      return d.toLocaleDateString('pt-BR');
    }

    function getMesAnoAtual() {
      const d = new Date();
      return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    }

    function getMesesOptions(selected) {
      const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      return meses.map((m, i) => `<option value="${i}" ${i == selected ? 'selected' : ''}>${m}</option>`).join('');
    }

    function getStatusSessaoBadge(status) {
      switch(status) {
        case 'Realizada': return 'bg-emerald-100 text-emerald-800';
        case 'Agendada': return 'bg-blue-100 text-blue-800';
        case 'Falta': return 'bg-amber-100 text-amber-800';
        case 'Cancelada': return 'bg-red-100 text-red-800';
        default: return 'bg-slate-100 text-slate-800';
      }
    }

    function getSemanaDoAno() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 1);
      return Math.ceil((((now - start) / 86400000) + start.getDay() + 1) / 7);
    }

    // INICIALIZAÇÃO DO SISTEMA
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
